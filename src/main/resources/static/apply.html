<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>助学金申请</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
    <div class="box">
        <h2>学生助学金申请</h2>
        <form>
            <input type="text" placeholder="请输入学生姓名">
            <input type="text" placeholder="请输入学号">
            <input type="text" placeholder="所在班级">
            <select>
                <option>贫困等级</option>
                <option>一般贫困</option>
                <option>特困</option>
            </select>
            <input type="text" placeholder="申请理由">
            <button type="button">提交申请</button>
            <button type="button" onclick="history.back()" style="background:#999;margin-left:10px">返回</button>
        </form>
    </div>
</body>
</html>
